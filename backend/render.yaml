services:
  - type: web
    name: aether-ai-bot
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: VERSION
        value: "1.0.0"
      - key: PORT
        value: "10000"
      # MongoDB Atlas URI — set in Render dashboard, not here
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: AETHER
      # Provider API Keys — set in Render dashboard
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Security — auth disabled for judging (plain API key or none)
      - key: SEC_API_KEYS_ENABLED
        value: "false"
